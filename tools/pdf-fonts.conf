<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
<match target="pattern"><test name="family" compare="eq"><string>MS 明朝</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit></match>
<match target="pattern"><test name="family" compare="eq"><string>MS Mincho</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit></match>
<match target="pattern"><test name="family" compare="eq"><string>MS ゴシック</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
<match target="pattern"><test name="family" compare="eq"><string>MS Gothic</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
</fontconfig>
